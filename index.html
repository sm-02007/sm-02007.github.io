<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Flores</title>
</head>
<body>
    <div class="hearts"></div>
    <div class="greetings">
    <div class="row row1">
        <span>F</span>
        <span>E</span>
        <span>L</span>
        <span>I</span>
        <span>Z</span>
        <span class="gap"></span>
        <span>C</span>
        <span>U</span>
        <span>M</span>
        <span>P</span>
        <span>L</span>
        <span>E</span>
    </div>

    <div class="row row2">
        <span>M</span>
        <span>I</span>
        <span>V</span>
        <span>I</span>
        <span>D</span>
        <span>A</span>
    </div>
</div>


    <div class="description">
        <span>tengo un regalito para vos!!</span>
    </div>

    <div class="button">
        <button>
            <a href="FLORES.html">Hace Clic</a>
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        const row1 = [...document.querySelectorAll(".row1 span")].filter(s => !s.classList.contains("gap"));
            const row2 = document.querySelectorAll(".row2 span");

            const delaysRow1 = [0.2, 0.4, 0.6, 1.0, 1.2, 1.4, 1.6, 1.8, 2.0, 2.2, 2.4];
            const delaysRow2 = [1.0, 1.2, 1.4, 1.6, 1.8, 2.0];

            row1.forEach((span, i) => span.style.animationDelay = delaysRow1[i] + "s");
            row2.forEach((span, i) => span.style.animationDelay = delaysRow2[i] + "s");

    </script>

</body>
</html>
